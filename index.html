<script>
const c=document.getElementById('fx'),x=c.getContext('2d');
let w,h,dpr,pts=[];
function resize(){
 dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
 c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);
 pts=Array.from({length:Math.min(95,Math.floor(w/10))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.18,r:Math.random()*1.5+.3,a:Math.random()*.55+.12}));
}
addEventListener('resize',resize); resize();
let mx=0,my=0;
addEventListener('pointermove',e=>{mx=(e.clientX/w-.5)*10;my=(e.clientY/h-.5)*10});
function loop(){
 x.clearRect(0,0,w,h);
 for(const p of pts){
   p.x+=p.vx;p.y+=p.vy;
   if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
   x.beginPath();x.fillStyle=`rgba(0,255,150,${p.a})`;x.arc(p.x+mx*.15,p.y+my*.15,p.r,0,Math.PI*2);x.fill();
 }
 for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
   const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
   if(dist<115){x.strokeStyle=`rgba(0,255,170,${.08*(1-dist/115)})`;x.lineWidth=.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
 }
 requestAnimationFrame(loop);
}
loop();
</script>
